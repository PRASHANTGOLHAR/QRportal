<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QR Portal</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<header class="topbar">
  <h1>QR Portal</h1>
  <p>Create QR codes for your equipment / SOP info</p>
</header>

<main class="container">
  <div id="env-warning" class="status err hidden"></div>
  <section class="card">
    <h2>Create a new QR</h2>
    <form id="create-form">
      <label>Title
        <input type="text" id="title" required placeholder="EX. Product Brochure" />
      </label>

      <label>Technical Specifications
        <textarea id="tech-specs" rows="3" placeholder="Model, capacity, power, dimensions…"></textarea>
      </label>

      <fieldset class="group">
        <legend>Quick Refresher (4–5 points)</legend>
        <div id="refresher-list">
          <div class="refresher-row">
            <input type="text" class="refresher-input" placeholder="Point 1" />
            <button type="button" class="ghost remove-refresher" title="Remove">&times;</button>
          </div>
        </div>
        <button type="button" id="add-refresher" class="ghost">+ Add point</button>
      </fieldset>

      <label>Safety Aspects
        <textarea id="safety" rows="3" placeholder="PPE, hazards, lockout/tagout…"></textarea>
      </label>

      <label>Operation Aspect
        <textarea id="operation" rows="3" placeholder="Start-up, run, shutdown steps…"></textarea>
      </label>

      <label>Rescue Aspect
        <textarea id="rescue" rows="3" placeholder="Emergency stop, evacuation, first aid…"></textarea>
      </label>

      <label>PPT file (optional)
        <input type="file" id="ppt" accept=".ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" />
      </label>

      <label>PDF / SOP file (optional)
        <input type="file" id="pdf" accept="application/pdf" />
      </label>

      <button type="submit" id="submit-btn">Create QR</button>
      <p class="hint">Max 2 GB per file.</p>
      <p id="form-status" class="status"></p>
    </form>
  </section>

  <section class="card">
    <h2>Existing QR codes</h2>
    <button id="refresh-btn" class="ghost">Refresh</button>
    <div id="list" class="list"></div>
  </section>
</main>

<!-- QR preview modal -->
<div id="qr-modal" class="modal hidden">
  <div class="modal-body">
    <button class="close" onclick="closeModal()">&times;</button>
    <h3 id="qr-title"></h3>
    <div id="qr-canvas"></div>
    <p class="qr-url"><a id="qr-link" target="_blank"></a></p>
    <button onclick="downloadQR()">Download QR (PNG)</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
